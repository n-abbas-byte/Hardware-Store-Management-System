<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSMS - Add Supplier</title>
<style>
  :root {
    --steel: #2b3a42;
    --bg: #e8eaec;
    --card: #ffffff;
    --line: #c5cbd0;
    --accent: #f2a900;
    --text: #1d262b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    margin: 1rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 6px solid var(--accent);
    border-radius: 6px;
    padding: 2rem;
  }
  h1 {
    margin: 0 0 1.5rem;
    font-size: 1.3rem;
    line-height: 1.3;
    color: var(--steel);
  }
  label { display: block; margin: 1rem 0 0.3rem; font-weight: 600; }
  input {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
  }
  input:focus, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--steel);
    outline-offset: 1px;
  }
  button {
    width: 100%;
    margin-top: 1.5rem;
    padding: 0.7rem;
    border: 0;
    border-radius: 4px;
    background: var(--accent);
    color: var(--text);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #d99800; }
  p { margin: 1.5rem 0 0; text-align: center; }
  a { color: var(--steel); }
</style>
</head>
<body>
  <main class="card">
    <h1>Add Supplier</h1>

    <form method="post" action="">
      <label for="companyName">Company Name</label>
      <input type="text" id="companyName" name="companyName" required>

      <label for="name">Contact Person</label>
      <input type="text" id="name" name="name" required>

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="address">Address</label>
      <input type="text" id="address" name="address">

      <button type="submit">Add Supplier</button>
    </form>

    <p><a href="index.html">Back to Login</a></p>
  </main>
</body>
</html>
