<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSMS - Add Product</title>
<style>
  :root {
    --steel: #2b3a42;
    --bg: #e8eaec;
    --card: #ffffff;
    --line: #c5cbd0;
    --accent: #f2a900;
    --text: #1d262b;
    --ok: #1e6b3a;
    --error: #a12622;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    margin: 1rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 6px solid var(--accent);
    border-radius: 6px;
    padding: 2rem;
  }
  h1 {
    margin: 0 0 1.5rem;
    font-size: 1.3rem;
    line-height: 1.3;
    color: var(--steel);
  }
  label { display: block; margin: 1rem 0 0.3rem; font-weight: 600; }
  input, select {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--steel);
    outline-offset: 1px;
  }
  button {
    width: 100%;
    margin-top: 1.5rem;
    padding: 0.7rem;
    border: 0;
    border-radius: 4px;
    background: var(--accent);
    color: var(--text);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #d99800; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .message { margin: 1rem 0 0; min-height: 1.4rem; font-weight: 600; }
  .message.ok { color: var(--ok); }
  .message.error { color: var(--error); }
  p { margin: 1.5rem 0 0; text-align: center; }
  a { color: var(--steel); }
</style>
</head>
<body>
  <main class="card">
    <h1>Add Product</h1>

    <form id="productForm">
      <label for="itemCode">Item Code</label>
      <input type="text" id="itemCode" required>

      <label for="name">Product Name</label>
      <input type="text" id="name" required>

      <label for="category">Category</label>
      <select id="category" required>
        <option value="" disabled selected>Select a category</option>
        <option value="Tools">Tools</option>
        <option value="Paint">Paint</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Electrical">Electrical</option>
        <option value="Fasteners">Fasteners</option>
        <option value="BuildingMaterials">Building Materials</option>
        <option value="Other">Other</option>
      </select>

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" min="0" required>

      <label for="unitPrice">Unit Price</label>
      <input type="number" id="unitPrice" min="0" step="0.01" required>

      <label for="lowStockLevel">Low Stock Level</label>
      <input type="number" id="lowStockLevel" min="0" required>

      <button type="submit" id="submitBtn">Add Product</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <p><a href="index.html">Back to Login</a></p>
  </main>

<script>
  const form = document.getElementById("productForm");
  const message = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  function readProduct() {
    return {
      itemCode: document.getElementById("itemCode").value.trim(),
      name: document.getElementById("name").value.trim(),
      category: document.getElementById("category").value,
      price: Number(document.getElementById("unitPrice").value),
      quantity: parseInt(document.getElementById("quantity").value, 10),
      lowStockLimit: parseInt(document.getElementById("lowStockLevel").value, 10)
    };
  }

  async function addProduct(event) {
    event.preventDefault();
    submitBtn.disabled = true;
    showMessage("Saving...", "");

    try {
      const response = await fetch("/api/products", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(readProduct())
      });

      if (response.ok) {
        const saved = await response.json();
        showMessage("Added \"" + saved.name + "\" (ID " + saved.id + ").", "ok");
        form.reset();
      } else {
        showMessage("Could not save the product (error " + response.status + ").", "error");
      }
    } catch (error) {
      showMessage("Cannot reach the server. Is the backend running?", "error");
    }

    submitBtn.disabled = false;
  }

  form.addEventListener("submit", addProduct);
</script>
</body>
</html>
