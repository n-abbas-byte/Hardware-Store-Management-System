<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSMS - Products</title>
<style>
  :root {
    --steel: #2b3a42;
    --bg: #e8eaec;
    --card: #ffffff;
    --line: #c5cbd0;
    --accent: #f2a900;
    --text: #1d262b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    margin: 1rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 6px solid var(--accent);
    border-radius: 6px;
    padding: 2rem;
  }
  h1 {
    margin: 0 0 1.5rem;
    font-size: 1.3rem;
    line-height: 1.3;
    color: var(--steel);
  }
  .option {
    display: block;
    margin-top: 1rem;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
  }
  .option span { display: block; margin-top: 0.25rem; font-weight: 400; font-size: 0.9rem; }
  .option:hover { border-color: var(--accent); background: #fff8e6; }
  .option:focus-visible, a:focus-visible { outline: 3px solid var(--steel); outline-offset: 1px; }
  p { margin: 1.5rem 0 0; text-align: center; }
  a { color: var(--steel); }
</style>
</head>
<body>
  <main class="card">
    <h1>Products</h1>

    <a class="option" href="products.html">
      View All Products
      <span>See stock, prices and low-stock items</span>
    </a>

    <a class="option" href="add-product.html">
      Add Product
      <span>Add a new item to the inventory</span>
    </a>

    <p><a href="index.html">Back to Login</a></p>
  </main>
</body>
</html>
